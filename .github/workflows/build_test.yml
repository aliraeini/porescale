name: Makefile CI

on:
  push:
    branches: [ "main", "test" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Install prerequisites
      run: sudo apt-get update && sudo apt-get -y install mpi-default-dev flex libscotch-dev zlib1g-dev libtiff-dev libjpeg-dev liblzma-dev python3-pip

    - uses: actions/checkout@v3

    - name: Update submodules
      run: git submodule update --init  --depth 1 --recursive

    - name: Build all
      run:
        make all -j2 || make all

    - name: Install the Python packages needed by some tests
      run: pip install pytest ./image3kit git+https://github.com/difizix/pnmkit.git

    - name: Run tests
      run: make test

    - name: Archive logs
      if: success() || failure()
      uses: actions/upload-artifact@v4
      with:
        name: application logs
        path: |
          test_runs/**/log.*
          test_runs/**/*.log
